services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sistema_escolar}
      POSTGRES_USER: ${DB_USERNAME:?Configura DB_USERNAME en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - escolar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  escolar_pg:
