name: Verificacion
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: escolar_test
          POSTGRES_USER: escolar
          POSTGRES_PASSWORD: solo-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U escolar -d escolar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: escolar_test
      DB_USERNAME: escolar
      DB_PASSWORD: solo-ci
      DEMO_PASSWORD: Solo-CI-No-Produccion-123
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, mbstring, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci && npm run build
      - run: php artisan migrate:fresh --seed --force
      - run: php artisan test
      - run: vendor/bin/pint --test
